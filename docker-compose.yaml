services:
  db:
    image: postgres:17
    container_name: finance-db
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: finance-api
    environment:
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no ambiente ou em um arquivo .env}
      DATABASE_URL: postgres://finance:finance@db:5432/finance?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  data:
